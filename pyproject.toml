[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazeworld"
version = "0.1.0"
description = "Procedurally generated maze RPG with AI-driven content"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6",
    "pydantic>=2.9",
    "python-dotenv>=1.1",
    "Pillow>=10.0",
    "markdown>=3.5",
    "weasyprint>=60.0",
    "protobuf>=4.25",
    "tqdm>=4.66",
]

[project.optional-dependencies]
local = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44",
    "accelerate>=0.34",
    "diffusers>=0.30",
    "sentencepiece>=0.2",
]
api = [
    "anthropic>=0.88",
    "fal-client>=0.13",
    "google-genai>=0.3",
    "elevenlabs>=1.0",
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=4.0",
    "pre-commit>=4.5",
    "ruff>=0.11",
    "pyinstaller>=6.11",
]
all = [
    "mazeworld[local]",
    "mazeworld[api]",
    "mazeworld[dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requires_data: needs generated world data (run pipeline first)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/prompts/generator_prompts/*.py" = ["E501"]
